<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LunarStore</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0d0d0f;
    color: white;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 0 7%;
    border-bottom: 1px solid #24242a;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #7c5cff;
}

.search {
    flex: 1;
}

.search input {
    width: 100%;
    max-width: 600px;
    padding: 13px 20px;
    border-radius: 12px;
    border: 1px solid #29292f;
    background: #18181c;
    color: white;
    outline: none;
    font-size: 15px;
}

.search input:focus {
    border-color: #7c5cff;
}

nav {
    display: flex;
    gap: 12px;
    padding: 25px 7%;
    overflow-x: auto;
}

nav a {
    text-decoration: none;
    color: #aaa;
    background: #18181c;
    border: 1px solid #29292f;
    padding: 10px 18px;
    border-radius: 20px;
}

nav a:hover {
    background: #7c5cff;
    color: white;
}

main {
    padding: 0 7%;
}

.hero {
    margin: 20px 0 50px;
    padding: 70px;
    border-radius: 25px;
    background: linear-gradient(120deg, #211c45, #15151b);
}

.hero small {
    color: #9b89ff;
    font-weight: bold;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: 52px;
    margin-top: 15px;
    line-height: 1.1;
}

.hero h1 span {
    color: #9b89ff;
}

.hero p {
    color: #aaa;
    margin-top: 20px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.section-title {
    font-size: 28px;
}

#resultCount {
    color: #777;
}

.apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding-bottom: 50px;
}

.app {
    background: #151519;
    border: 1px solid #24242a;
    border-radius: 18px;
    padding: 20px;
    transition: 0.2s;
}

.app:hover {
    transform: translateY(-5px);
    border-color: #7c5cff;
}

.app img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 18px;
    margin-bottom: 18px;
}

.app h3 {
    margin-bottom: 8px;
}

.app p {
    color: #888;
    font-size: 14px;
}

.app .category {
    color: #9b89ff;
    margin-top: 10px;
}

.download {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #7c5cff;
    color: white;
    padding: 11px;
    border-radius: 10px;
    margin-top: 18px;
    font-weight: bold;
}

.download:hover {
    background: #927cff;
}

.no-results {
    color: #777;
    font-size: 18px;
    padding: 30px 0;
}

@media (max-width: 700px) {

    header {
        height: auto;
        padding: 15px;
        flex-wrap: wrap;
    }

    .search {
        flex-basis: 100%;
        order: 3;
    }

    main {
        padding: 0 15px;
    }

    .hero {
        padding: 35px 25px;
    }

    .hero h1 {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Lunar<span>Store</span>
    </div>

    <div class="search">

        <input
            type="search"
            id="searchInput"
            placeholder="Search apps..."
            autocomplete="off"
        >

    </div>

</header>

<nav>

    <a href="index.html">
        All
    </a>

    <a href="#">
        Productivity
    </a>

    <a href="#">
        Games
    </a>

    <a href="#">
        Tools
    </a>

    <a href="#">
        Media
    </a>

</nav>

<main>

<section class="hero">

    <small>
        DISCOVER SOMETHING NEW
    </small>

    <h1>
        Find your next<br>
        <span>favorite app.</span>
    </h1>

    <p>
        Discover useful tools, powerful software, and amazing apps.
    </p>

</section>

<section>

    <div class="section-header">

        <h2 class="section-title">
            Apps
        </h2>

        <span id="resultCount">
            2 apps
        </span>

    </div>

    <div class="apps" id="apps">

        <!-- PIXEL RUNNER -->

        <div
            class="app"
            data-name="Pixel Runner"
            data-developer="Game Studio"
            data-category="Games"
            data-description="A fast-paced pixel adventure game"
        >

            <img
                src="apps/gamestudio.pixel-runner/icon.png"
                alt="Pixel Runner"
            >

            <h3>
                Pixel Runner
            </h3>

            <p>
                Game Studio
            </p>

            <p class="category">
                Games
            </p>

            <a
                class="download"
                href="apps/gamestudio.pixel-runner/index.html"
            >
                Download
            </a>

        </div>


        <!-- AIOOS -->

        <div
            class="app"
            data-name="AioOS"
            data-developer="Barad"
            data-category="Tools"
            data-description="A powerful fake operating system built with Python"
        >

            <img
                src="apps/barad.aioos/icon.png"
                alt="AioOS"
            >

            <h3>
                AioOS
            </h3>

            <p>
                Barad
            </p>

            <p class="category">
                Tools
            </p>

            <a
                class="download"
                href="https://cafebazaar.ir/download/bazaar.apk"
            >
                Download
            </a>

        </div>

    </div>

    <div
        class="no-results"
        id="noResults"
        style="display: none;"
    >
        No apps found.
    </div>

</section>

</main>

<script>

const searchInput =
    document.getElementById("searchInput");

const apps =
    document.querySelectorAll(".app");

const resultCount =
    document.getElementById("resultCount");

const noResults =
    document.getElementById("noResults");

searchInput.addEventListener("input", function () {

    const search =
        this.value.toLowerCase().trim();

    let visibleApps = 0;

    apps.forEach(function (app) {

        const searchableText = (

            app.dataset.name + " " +
            app.dataset.developer + " " +
            app.dataset.category + " " +
            app.dataset.description

        ).toLowerCase();

        if (
            searchableText.includes(search)
        ) {

            app.style.display = "";

            visibleApps++;

        } else {

            app.style.display = "none";

        }

    });

    resultCount.textContent =
        visibleApps + " app" +
        (visibleApps === 1 ? "" : "s");

    if (visibleApps === 0) {

        noResults.style.display = "block";

    } else {

        noResults.style.display = "none";

    }

});

</script>

</body>
</html>
