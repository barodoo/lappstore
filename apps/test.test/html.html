<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Runner - LunarStore</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0d0d0f;
    color: white;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    padding: 0 7%;
    border-bottom: 1px solid #24242a;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
    color: white;
}

.logo span {
    color: #7c5cff;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 70px 25px;
}

.back {
    color: #aaa;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 40px;
}

.back:hover {
    color: white;
}

.app-header {
    display: flex;
    gap: 30px;
    align-items: center;
}

.app-icon {
    width: 150px;
    height: 150px;
    border-radius: 35px;
    object-fit: cover;
}

.app-info h1 {
    font-size: 45px;
    margin-bottom: 10px;
}

.developer {
    color: #aaa;
    font-size: 17px;
}

.category {
    color: #9b89ff;
    margin-top: 12px;
}

.download {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 28px;
    background: #7c5cff;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

.download:hover {
    background: #927cff;
}

.content {
    margin-top: 70px;
    max-width: 750px;
}

.content h2 {
    font-size: 28px;
    margin-bottom: 20px;
}

.content p {
    color: #aaa;
    line-height: 1.7;
    font-size: 16px;
}

.info {
    display: flex;
    gap: 60px;
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px solid #24242a;
}

.info div {
    color: #888;
}

.info strong {
    display: block;
    color: white;
    margin-top: 6px;
}

@media (max-width: 700px) {

    .app-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .app-info h1 {
        font-size: 36px;
    }

}

</style>
</head>

<body>

<header>

    <a
        class="logo"
        href="../../../index.html"
    >
        Lunar<span>Store</span>
    </a>

</header>

<main>

    <a
        class="back"
        href="../../../index.html"
    >
        ← Back to LunarStore
    </a>


    <section class="app-header">

        <img
            class="app-icon"
            src="icon.png"
            alt="Pixel Runner"
        >

        <div class="app-info">

            <h1>
                Pixel Runner
            </h1>

            <p class="developer">
                Game Studio
            </p>

            <p class="category">
                Games
            </p>

            <a
                class="download"
                href="PixelRunner.exe"
                download
            >
                Download Pixel Runner
            </a>

        </div>

    </section>


    <section class="content">

        <h2>
            About this app
        </h2>

        <p>
            Pixel Runner is a fast-paced pixel adventure game.
            Run, jump, avoid obstacles, and try to get the highest score.
        </p>


        <div class="info">

            <div>
                Version
                <strong>1.0.0</strong>
            </div>

            <div>
                Developer
                <strong>Game Studio</strong>
            </div>

            <div>
                Category
                <strong>Games</strong>
            </div>

        </div>

    </section>

</main>

</body>
</html>
